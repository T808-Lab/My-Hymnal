<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Open Hymnal Reader</title>
    <!-- Apple PWA Meta Tags to make it look like a native app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hymnal Pro">
    
    <!-- Tailwind CSS for modern iPad UI -->
    <script src="https://tailwindcss.com"></script>
    <!-- PDF.js Framework for fluid, high-res sheet music rendering and scaling -->
    <script src="https://cloudflare.com"></script>

    <style>
        /* Smooth native-like behaviors for iOS */
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* Native iOS momentum scrolling */
        .ios-scroll { -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 h-screen w-screen overflow-hidden flex flex-col select-none">

    <!-- APP HEADER -->
    <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 px-6 py-4 flex items-center justify-between pt-12 z-10">
        <div class="flex items-center gap-4">
            <button id="backBtn" class="hidden text-amber-400 font-medium flex items-center gap-1 active:scale-95 transition">
                <span>◀</span> Back to Index
            </button>
            <h1 id="appTitle" class="text-xl font-bold tracking-tight text-amber-400">📖 Open Hymnal 2014</h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="bookmarkBtn" class="hidden text-2xl active:scale-95 transition">☆</button>
            <span id="pageIndicator" class="hidden text-sm text-slate-400 font-mono">Page 1 / 1</span>
        </div>
    </header>

    <!-- MAIN INTERACTIVE CONTAINER -->
    <main class="flex-1 relative overflow-hidden flex">
        
        <!-- DASHBOARD VIEW (INDEX / SEARCH / CATEGORIES) -->
        <div id="dashboardView" class="w-full h-full flex flex-col p-6 gap-6 ios-scroll overflow-y-auto">
            
            <!-- Search Control -->
            <div class="relative w-full max-w-xl mx-auto">
                <input type="text" id="searchInput" placeholder="🔎 Search by hymn title or number..." 
                       class="w-full bg-slate-800 border border-slate-700 rounded-2xl py-4 px-6 text-lg focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>

            <!-- Dashboard Content Layout -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-6xl mx-auto w-full">
                <!-- Left Column: Table of Contents & Bookmarks -->
                <div class="md:col-span-2 flex flex-col gap-4">
                    <h2 class="text-lg font-semibold text-slate-400 tracking-wider uppercase">📑 Hymns List</h2>
                    <div id="hymnListContainer" class="bg-slate-800 rounded-2xl divide-y divide-slate-700 overflow-hidden shadow-xl">
                        <!-- Dynamic list renders here -->
                    </div>
                </div>

                <!-- Right Column: Quick Categories -->
                <div class="flex flex-col gap-4">
                    <h2 class="text-lg font-semibold text-slate-400 tracking-wider uppercase">⭐ Bookmarks & Categories</h2>
                    <div id="favoritesSection" class="bg-slate-800 p-4 rounded-2xl hidden shadow-xl mb-2 border border-amber-500/20">
                        <h3 class="text-amber-400 font-bold mb-2 flex items-center gap-2">⭐ My Bookmarks</h3>
                        <div id="favoritesList" class="flex flex-col gap-2"></div>
                    </div>
                    <div id="categoryContainer" class="grid grid-cols-1 gap-3">
                        <!-- Categories automatically render here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- SHEET MUSIC VIEWER (PIANO PLAYER MODE) -->
        <div id="sheetMusicView" class="hidden w-full h-full relative bg-slate-950 flex items-center justify-center">
            <!-- Left/Right Transparent tap regions for rapid piano page turning -->
            <div id="prevZone" class="absolute left-0 top-0 w-1/4 h-full z-20 cursor-w-resize"></div>
            <div id="nextZone" class="absolute right-0 top-0 w-1/4 h-full z-20 cursor-e-resize"></div>

            <!-- Render viewport supporting pinch/zoom -->
            <div id="canvasWrapper" class="w-full h-full overflow-auto flex items-start justify-center p-2 ios-scroll no-scrollbar">
                <canvas id="pdfCanvas" class="shadow-2xl max-w-full rounded bg-white"></canvas>
            </div>
        </div>
    </main>

    <!-- HYMN DATA INDEX MATRIX -->
    <script>
        // Mapped structural indices referencing the OpenHymnal2014.06.pdf configuration
        const hymnDatabase = [
            { id: 1, number: "1", title: "Abide, O Dearest Jesus", page: 5, category: "Lord's Day & Closing" },
            { id: 2, number: "2", title: "Abide With Me", page: 7, category: "Lord's Day & Closing" },
            { id: 3, number: "10", title: "All Creatures of Our God and King", page: 17, category: "Praise & Adoration" },
            { id: 4, number: "12", title: "All Glory, Laud, and Honor", page: 21, category: "Palm Sunday" },
            { id: 5, number: "14", title: "All My Heart This Night Rejoices", page: 24, category: "Christmas" },
            { id: 6, number: "25", title: "Amazing Grace", page: 38, category: "Grace & Salvation" },
            { id: 7, number: "30", title: "Angels We Have Heard On High", page: 44, category: "Christmas" },
            { id: 8, number: "36", title: "Be Still My Soul", page: 51, category: "Comfort & Trust" },
            { id: 9, number: "37", title: "Be Thou My Vision", page: 53, category: "Christian Life" },
            { id: 10, number: "50", title: "Blessed Assurance", page: 71, category: "Assurance & Peace" }
            // Note: You can ask an AI text tool later to read the text list of Open Hymnal 2014 
            // and format remaining lines exactly like this array structure to fill it up!
        ];

        // System Core Settings
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';
        let pdfDoc = null;
        let currentHymn = null;
        let currentScale = window.innerWidth < 1024 ? 1.4 : 2.0; // Optimized scale footprints for iPad retina displays
        let favorites = JSON.parse(localStorage.getItem('hymnal_favs')) || [];

        // App Views 
        const dashboardView = document.getElementById('dashboardView');
        const sheetMusicView = document.getElementById('sheetMusicView');
        const backBtn = document.getElementById('backBtn');
        const appTitle = document.getElementById('appTitle');
        const bookmarkBtn = document.getElementById('bookmarkBtn');
        const pageIndicator = document.getElementById('pageIndicator');
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');

        // Initialize Core Engine
        async function loadPDF() {
            try {
                // Must have downloaded 'hymnal.pdf' inside the folder root
                pdfDoc = await pdfjsLib.getDocument('hymnal.pdf').promise;
                renderDashboardList(hymnDatabase);
                renderCategories();
                renderFavorites();
            } catch (err) {
                alert("Could not load hymnal.pdf. Make sure it is saved in the exact same directory folder as this web file.");
            }
        }

        function renderDashboardList(songs) {
            const container = document.getElementById('hymnListContainer');
            container.innerHTML = songs.map(song => `
                <div onclick="openHymn(${song.id})" class="flex items-center justify-between p-4 hover:bg-slate-700/50 active:bg-slate-700 transition cursor-pointer">
                    <div class="flex items-center gap-4">
                        <span class="text-amber-500 font-mono font-bold text-lg w-10">${song.number}</span>
                        <div>
                            <div class="font-semibold text-slate-100 text-lg">${song.title}</div>
                            <div class="text-sm text-slate-400">${song.category}</div>
                        </div>
                    </div>
                    <span class="text-slate-500 text-sm">p. ${song.page} ➔</span>
                </div>
            `).join('');
        }

        function renderCategories() {
            const categories = [...new Set(hymnDatabase.map(s => s.category))];
            const container = document.getElementById('categoryContainer');
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="bg-slate-800 text-left p-4 rounded-xl border border-slate-700 hover:border-amber-500/40 active:scale-[0.98] transition">
                    <span class="font-medium text-slate-200">${cat}</span>
                </button>
            `).join('') + `<button onclick="filterCategory('All')" class="bg-slate-800/40 text-left p-4 rounded-xl border border-dashed border-slate-700 text-center text-slate-400 font-medium">Show All Hymns</button>`;
        }

        function filterCategory(cat) {
            if (cat === 'All') return renderDashboardList(hymnDatabase);
            const filtered = hymnDatabase.filter(s => s.category === cat);
            renderDashboardList(filtered);
        }

        function renderFavorites() {
            const favSection = document.getElementById('favoritesSection');
            const favList = document.getElementById('favoritesList');
            if (favorites.length === 0) {
                favSection.classList.add('hidden');
                return;
            }
            favSection.classList.remove('hidden');
            const favSongs = hymnDatabase.filter(s => favorites.includes(s.id));
            favList.innerHTML = favSongs.map(song => `
                <div onclick="openHymn(${song.id})" class="bg-slate-700/40 hover:bg-slate-700 p-3 rounded-xl flex items-center justify-between cursor-pointer transition">
                    <span class="font-medium text-slate-200 text-sm truncate">${song.number}. ${song.title}</span>
                    <span class="text-xs text-amber-400 font-mono">p.${song.page}</span>
                </div>
            `).join('');
        }

        // PDF Renderer Logic
        async function renderSheetPage(pageNumber) {
            pageIndicator.textContent = `Page ${pageNumber} / ${pdfDoc.numPages}`;
            const page = await pdfDoc.getPage(pageNumber);
            const viewport = page.getViewport({ scale: currentScale });
            
            // Adjust canvas to high resolution sizing specs
            canvas.height = viewport.height;
            canvas.width = viewport.width;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };
            await page.render(renderContext).promise;
        }

        window.openHymn = async function(id) {
            currentHymn = hymnDatabase.find(s => s.id === id);
            dashboardView.classList.add('hidden');
            sheetMusicView.classList.remove('hidden');
            backBtn.classList.remove('hidden');
            bookmarkBtn.classList.remove('hidden');
            pageIndicator.classList.remove('hidden');
            
            appTitle.textContent = `${currentHymn.number}. ${currentHymn.title}`;
            updateBookmarkBtnUI();
            await renderSheetPage(currentHymn.page);
        };

        // Navigation Back to Index Dashboard
        backBtn.onclick = () => {
            dashboardView.classList.remove('hidden');
            sheetMusicView.classList.add('hidden');
            backBtn.classList.add('hidden');
            bookmarkBtn.classList.add('hidden');
            pageIndicator.classList.add('hidden');
            appTitle.textContent = "📖 Open Hymnal 2014";
            renderFavorites();
        };

        // Bookmarking Engine
        bookmarkBtn.onclick = () => {
            if (!currentHymn) return;
            const index = favorites.indexOf(currentHymn.id);
            if (index > -1) {
                favorites.splice(index, 1);
            } else {
                favorites.push(currentHymn.id);
            }
            localStorage.setItem('hymnal_favs', JSON.stringify(favorites));
            updateBookmarkBtnUI();
        };

        function updateBookmarkBtnUI() {
            if (currentHymn && favorites.includes(currentHymn.id)) {
                bookmarkBtn.textContent = "★";
                bookmarkBtn.className = "text-2xl text-amber-400 active:scale-95 transition";
            } else {
                bookmarkBtn.textContent = "☆";
                bookmarkBtn.className = "text-2xl text-slate-400 active:scale-95 transition";
            }
        }

        // Tap-to-Turn Pages (Piano-friendly zone bounds)
        document.getElementById('nextZone').onclick = (e) => {
            e.stopPropagation();
            if (currentHymn && currentHymn.page < pdfDoc.numPages) {
                currentHymn.page++;
                renderSheetPage(currentHymn.page);
            }
        };

        document.getElementById('prevZone').onclick = (e) => {
            e.stopPropagation();
            if (currentHymn && currentHymn.page > 1) {
                currentHymn.page--;
                renderSheetPage(currentHymn.page);
            }
        };

        // Filter Matrix Engine Search Input
        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = hymnDatabase.filter(s => 
                s.title.toLowerCase().includes(query) || 
                s.number.includes(query) ||
                s.category.toLowerCase().includes(query)
            );
            renderDashboardList(filtered);
        };

        // Fire Load sequences
        loadPDF();
    </script>
</body>
</html>
