<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hymnal for iPad</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://tailwindcss.com"></script>
    <script src="https://cloudflare.com"></script>
    
    <style>
        @import url('https://googleapis.com');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAF6F0;
            color: #2D221E;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .serif-title {
            font-family: 'Cinzel', Georgia, serif;
        }
        .brand-bg { background-color: #5C1D24; }
        .brand-text { color: #5C1D24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <!-- PREMIUM NAVIGATION BAR -->
    <nav class="bg-[#FAF6F0] border-b border-[#E8DFD3] px-8 py-4 flex items-center justify-between pt-10 z-30 shrink-0">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('home')">
            <div class="brand-bg text-white p-2 rounded-xl text-lg font-bold">📖</div>
            <span class="serif-title text-xl font-bold tracking-wide brand-text">Hymnal</span>
        </div>
        <div class="flex items-center gap-2 bg-[#F3EBE0] p-1.5 rounded-full text-sm font-medium">
            <button id="nav-home" onclick="switchTab('home')" class="px-5 py-2 rounded-full transition brand-bg text-white shadow-sm">Home</button>
            <button id="nav-search" onclick="switchTab('search')" class="px-5 py-2 rounded-full transition text-[#5C4D46] hover:bg-[#EADFCF]">Search</button>
            <button id="nav-contents" onclick="switchTab('contents')" class="px-5 py-2 rounded-full transition text-[#5C4D46] hover:bg-[#EADFCF]">Contents</button>
            <button id="nav-favorites" onclick="switchTab('favorites')" class="px-5 py-2 rounded-full transition text-[#5C4D46] hover:bg-[#EADFCF]">Favorites</button>
        </div>
    </nav>

    <!-- VIEWS ENGINE CONTAINER -->
    <main class="flex-1 relative overflow-hidden">

        <!-- 1. HOME SCREEN VIEW -->
        <div id="view-home" class="absolute inset-0 overflow-y-auto p-8 flex flex-col gap-10">
            <!-- Hero Banner card matched to layout layout -->
            <div class="brand-bg rounded-[2rem] p-12 text-white relative overflow-hidden shadow-xl max-w-6xl mx-auto w-full">
                <p class="text-xs uppercase tracking-[0.2em] opacity-60 font-semibold mb-3">A Hymnal for iPad</p>
                <h2 class="serif-title text-5xl font-normal leading-tight mb-4 max-w-xl">Sing with understanding</h2>
                <p class="opacity-80 max-w-lg text-base leading-relaxed mb-8">Browse by category, search by title or number, bookmark your favorites, and view sheet music with pinch-to-zoom — all offline.</p>
                <button onclick="switchTab('search')" class="bg-white text-[#2D221E] px-6 py-4 rounded-2xl font-medium flex items-center gap-3 shadow-md active:scale-95 transition">
                    <span>🔍</span> Search hymns
                </button>
            </div>

            <!-- Dashboard Sub-Lists -->
            <div class="max-w-6xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-8">
                <div>
                    <h3 class="serif-title text-xl font-bold mb-4 opacity-80">Categories</h3>
                    <div onclick="switchTab('contents')" class="bg-white border border-[#E8DFD3] p-6 rounded-2xl flex items-center justify-between cursor-pointer hover:shadow-md transition">
                        <div>
                            <h4 class="font-semibold text-lg">All Public Hymns</h4>
                            <p class="text-sm opacity-60 mt-1">Open Hymnal 2014 Edition</p>
                        </div>
                        <span class="text-xl opacity-40">➔</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. SEARCH ENGINE VIEW -->
        <div id="view-search" class="absolute inset-0 hidden overflow-y-auto p-8 flex flex-col gap-6">
            <div class="max-w-3xl mx-auto w-full">
                <input type="text" id="searchInput" placeholder="Search by number, title, or keyword..." 
                       class="w-full bg-white border border-[#E8DFD3] rounded-2xl py-4 px-6 text-lg focus:outline-none focus:border-[#5C1D24] shadow-sm transition">
                <div id="searchResults" class="mt-6 bg-white border border-[#E8DFD3] rounded-2xl divide-y divide-[#E8DFD3] overflow-hidden shadow-sm"></div>
            </div>
        </div>

        <!-- 3. ALPHABETICAL/NUMERICAL CONTENTS VIEW -->
        <div id="view-contents" class="absolute inset-0 hidden overflow-y-auto p-8">
            <div class="max-w-4xl mx-auto w-full flex flex-col gap-8">
                <div class="flex items-center justify-between border-b border-[#E8DFD3] pb-4">
                    <h2 class="serif-title text-3xl font-bold brand-text">Table of Contents</h2>
                    <div class="bg-[#F3EBE0] p-1 rounded-xl text-xs font-semibold flex gap-1">
                        <button id="sort-alpha" onclick="renderContents('alpha')" class="px-4 py-1.5 rounded-lg bg-white shadow-sm brand-text">Alphabetical</button>
                        <button id="sort-num" onclick="renderContents('num')" class="px-4 py-1.5 rounded-lg text-[#5C4D46]">By Number</button>
                    </div>
                </div>
                <div id="contentsGrid" class="flex flex-col gap-8"></div>
            </div>
        </div>

        <!-- 4. FAVORITES VIEW -->
        <div id="view-favorites" class="absolute inset-0 hidden overflow-y-auto p-8">
            <div class="max-w-3xl mx-auto w-full">
                <h2 class="serif-title text-3xl font-bold brand-text mb-6">Bookmarked Scores</h2>
                <div id="favoritesList" class="bg-white border border-[#E8DFD3] rounded-2xl divide-y divide-[#E8DFD3] overflow-hidden shadow-sm"></div>
            </div>
        </div>

        <!-- 5. PIANO SHEET MUSIC SHEET PLAYER SCREEN -->
        <div id="view-music" class="absolute inset-0 hidden bg-[#1A1513] flex flex-col z-40">
            <div class="bg-[#2D221E] px-6 py-4 flex items-center justify-between text-white">
                <button onclick="closeMusicViewer()" class="text-[#EADFCF] font-medium flex items-center gap-2">◀ Back</button>
                <h2 id="musicTitle" class="serif-title font-bold text-lg text-amber-100">Hymn</h2>
                <button id="musicFavBtn" onclick="toggleFavoriteCurrent()" class="text-2xl">☆</button>
            </div>
            <div class="flex-1 overflow-auto flex items-start justify-center p-4 relative no-scrollbar" id="canvasScrollArea">
                <div id="prevPageZone" onclick="turnPage(-1)" class="absolute left-0 top-0 w-1/5 h-full cursor-w-resize z-50"></div>
                <div id="nextPageZone" onclick="turnPage(1)" class="absolute right-0 top-0 w-1/5 h-full cursor-e-resize z-50"></div>
                <canvas id="pdfCanvas" class="bg-white shadow-2xl rounded max-w-full"></canvas>
            </div>
        </div>

    </main>

    <!-- CORE DATA MATRIX ENGINE -->
    <script>
        // Mapped structural entries referencing the OpenHymnal2014.06.pdf configuration
        const hymnDatabase = [
            { number: 1, title: "Abide, O Dearest Jesus", page: 5 },
            { number: 2, title: "Abide With Me", page: 7 },
            { number: 10, title: "All Creatures of Our God and King", page: 17 },
            { number: 12, title: "All Glory, Laud, and Honor", page: 21 },
            { number: 14, title: "All My Heart This Night Rejoices", page: 24 },
            { number: 25, title: "Amazing Grace", page: 38 },
            { number: 30, title: "Angels We Have Heard On High", page: 44 },
            { number: 36, title: "Be Still My Soul", page: 51 },
            { number: 37, title: "Be Thou My Vision", page: 53 },
            { number: 50, title: "Blessed Assurance", page: 71 }
        ];

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cloudflare.com';
        let pdfDoc = null;
        let activeHymn = null;
        let activePage = 1;
        let bookmarks = JSON.parse(localStorage.getItem('hymn_bookmarks')) || [];

        // Tab Navigation Management Engine
        function switchTab(tabId) {
            ['home', 'search', 'contents', 'favorites'].forEach(view => {
                document.getElementById(`view-${view}`).classList.add('hidden');
                document.getElementById(`nav-${view}`).className = "px-5 py-2 rounded-full transition text-[#5C4D46] hover:bg-[#EADFCF]";
            });
            document.getElementById(`view-${tabId}`).classList.remove('hidden');
            document.getElementById(`nav-${tabId}`).className = "px-5 py-2 rounded-full transition brand-bg text-white shadow-sm";
            if(tabId === 'contents') renderContents('alpha');
            if(tabId === 'favorites') renderFavoritesView();
        }

        // Contents Structural Categorizer Builder
        function renderContents(mode) {
            const grid = document.getElementById('contentsGrid');
            const btnAlpha = document.getElementById('sort-alpha');
            const btnNum = document.getElementById('sort-num');
            grid.innerHTML = "";

            if (mode === 'alpha') {
                btnAlpha.className = "px-4 py-1.5 rounded-lg bg-white shadow-sm brand-text";
            btnNum.className = "px-4 py-1.5 rounded-lg text-[#5C4D46]";
                
            // Sort Alphabetically
            const sorted = [...hymnDatabase].sort((a,b) => a.title.localeCompare(b.title));
            const groups = {};
            sorted.forEach(hymn => {
                const firstLetter = hymn.title.charAt(0).toUpperCase();
                if (!groups[firstLetter]) groups[firstLetter] = [];
                groups[firstLetter].push(hymn);
            });

            for (let letter in groups) {
                let section = document.createElement('div');
                section.className = "flex flex-col gap-3";
                section.innerHTML = `
                    <div class="serif-title text-xl font-bold brand-text border-b border-[#E8DFD3] pb-1 w-12 text-center bg-[#F3EBO0] rounded-lg">${letter}</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-2">${groups[letter].map(h => renderHymnRowCard(h)).join('')}</div>
                `;
                grid.appendChild(section);
            }
        } else {
            btnNum.className = "px-4 py-1.5 rounded-lg bg-white shadow-sm brand-text";
            btnAlpha.className = "px-4 py-1.5 rounded-lg text-[#5C4D46]";

            // Sort Numerically
            const sorted = [...hymnDatabase].sort((a,b) => a.number - b.number);
            let section = document.createElement('div');
            section.className = "grid grid-cols-1 md:grid-cols-2 gap-3";
            section.innerHTML = sorted.map(h => renderHymnRowCard(h)).join('');
            grid.appendChild(section);
        }
    }

    function renderHymnRowCard(hymn) {
        return `
            <div onclick="openHymnSheet(${hymn.number})" class="bg-white border border-[#E8DFD3] p-4 rounded-xl flex items-center justify-between cursor-pointer hover:border-[#5C1D24]/40 hover:shadow-sm transition active:scale-[0.99]">
                <div class="flex items-center gap-4 min-w-0">
                    <span class="font-mono font-bold brand-text text-base w-8">${hymn.number}</span>
                    <span class="font-medium text-[#2D221E] truncate pr-2">${hymn.title}</span>
                </div>
                <span class="text-xs font-mono opacity-40 shrink-0">p. ${hymn.page}</span>
            </div>
        `;
    }

    // Native Piano Canvas Core View Engine
    async function openHymnSheet(number) {
        activeHymn = hymnDatabase.find(h => h.number === number);
        if (!activeHymn || !pdfDoc) return;
        
        document.getElementById('view-music').classList.remove('hidden');
        document.getElementById('musicTitle').textContent = `${activeHymn.number}. ${activeHymn.title}`;
        activePage = activeHymn.page;
        updateFavBtnUI();
        await renderPDFPage(activePage);
    }

    async function renderPDFPage(pageNum) {
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const page = await pdfDoc.getPage(pageNum);
        
        // Render high DPI canvas maps optimized perfectly for pinch zooming on Retina displays
        const viewport = page.getViewport({ scale: 2.2 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        document.getElementById('canvasScrollArea').scrollTop = 0;
    }

    function turnPage(direction) {
        activePage += direction;
        if (activePage < 1) activePage = 1;
        if (activePage > pdfDoc.numPages) activePage = pdfDoc.numPages;
        renderPDFPage(activePage);
    }

    function closeMusicViewer() {
        document.getElementById('view-music').classList.add('hidden');
    }

    // Search Engine Filter Handler
    document.getElementById('searchInput').oninput = (e) => {
        const query = e.target.value.toLowerCase().trim();
        const resultsBox = document.getElementById('searchResults');
        if(!query) { resultsBox.innerHTML = ""; return; }

        const matches = hymnDatabase.filter(h => 
            h.title.toLowerCase().includes(query) || h.number.toString().includes(query)
        );
        resultsBox.innerHTML = matches.map(h => `
            <div onclick="openHymnSheet(${h.number})" class="p-4 hover:bg-[#F3EBE0] cursor-pointer flex justify-between items-center transition">
                <span><strong class="brand-text font-mono">${h.number}.</strong> ${h.title}</span>
                <span class="text-xs opacity-50">Page ${h.page}</span>
            </div>
        `).join('') || `<div class="p-4 text-center opacity-50 text-sm">No matching hymns found</div>`;
    };

    // Bookmarks Core Management Engine
    function toggleFavoriteCurrent() {
        if (!activeHymn) return;
        const idx = bookmarks.indexOf(activeHymn.number);
        if (idx > -1) bookmarks.splice(idx, 1);
        else bookmarks.push(activeHymn.number);
        localStorage.setItem('hymn_bookmarks', JSON.stringify(bookmarks));
        updateFavBtnUI();
    }

    function updateFavBtnUI() {
        const btn = document.getElementById('musicFavBtn');
        if (activeHymn && bookmarks.includes(activeHymn.number)) {
            btn.textContent = "★"; btn.className = "text-2xl text-amber-400";
        } else {
            btn.textContent = "☆"; btn.className = "text-2xl text-white/60";
        }
    }

    function renderFavoritesView() {
        const box = document.getElementById('favoritesList');
        const favHymns = hymnDatabase.filter(h => bookmarks.includes(h.number));
        box.innerHTML = favHymns.map(h => `
            <div onclick="openHymnSheet(${h.number})" class="p-4 bg-white hover:bg-[#F3EBE0] cursor-pointer flex justify-between items-center transition">
                <span><strong class="brand-text font-mono">${h.number}.</strong> ${h.title}</span>
                <span class="text-sm opacity-40">➔</span>
            </div>
        `).join('') || `<div class="p-6 text-center opacity-50 text-sm bg-white">Your bookmarked hymns will show up here</div>`;
    }

    // Boot-Up Initialization sequence
    async function init() {
        try {
            pdfDoc = await pdfjsLib.getDocument('hymnal.pdf').promise;
        } catch (err) {
            alert("Could not load hymnal.pdf. Make sure it is in your GitHub folder and named exactly lowercase 'hymnal.pdf'.");
        }
    }
    init();
    </script>
</body>
</html>
